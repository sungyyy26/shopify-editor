<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Shopify Editor</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="topbar">
  <h1>Shopify 일괄 편집기</h1>
  <svg class="logo" viewBox="0 0 220 100" width="64" height="29" aria-label="EQB">
    <rect x="4" y="10" width="140" height="80" rx="40" fill="none" stroke="currentColor" stroke-width="7"/>
    <rect x="76" y="10" width="140" height="80" rx="40" fill="none" stroke="currentColor" stroke-width="7"/>
    <text x="44" y="61" font-size="30" font-weight="700" text-anchor="middle" fill="currentColor">EQ</text>
    <text x="181" y="61" font-size="30" font-weight="700" text-anchor="middle" fill="currentColor">B</text>
  </svg>
</header>

<section class="card">
  <h2>1. 조건</h2>
  <p class="hint">아래 항목 중 하나 이상만 입력하면 됩니다.</p>

  <label class="field">
    <span>상태 (복수 선택 가능)</span>
    <details class="dropdown" id="status-dropdown">
      <summary id="status-summary">상태 선택</summary>
      <div class="dropdown-panel">
        <label><input type="checkbox" name="cond-status" value="all" /> 전체 상태</label>
        <label><input type="checkbox" name="cond-status" value="unpublished" /> 미게시</label>
        <label><input type="checkbox" name="cond-status" value="active" /> 활성</label>
        <label><input type="checkbox" name="cond-status" value="draft" /> 초안</label>
      </div>
    </details>
  </label>

  <label class="field"><span>제목</span> <input type="text" id="cond-title" placeholder="제목에 포함된 텍스트" /></label>
  <label class="field"><span>URL 핸들</span> <input type="text" id="cond-handle" placeholder="예: ad-202609-4288" /></label>
  <label class="field"><span>태그</span> <input type="text" id="cond-tags" placeholder="쉼표로 구분" /></label>
</section>

<section class="card">
  <button id="btn-search" class="btn-primary">조건에 맞는 페이지 검색</button>
</section>

<section class="card">
  <h2>검색 결과</h2>
  <div id="results">검색 버튼을 눌러 조건에 맞는 페이지를 확인하세요.</div>
</section>

<section class="card">
  <h2>2. 수정사항</h2>
  <label class="field"><span>제목</span> <input type="text" id="mod-title" placeholder="새 제목 (비워두면 유지)" /></label>
  <label class="field"><span>설명 (HTML)</span> <textarea id="mod-description" rows="6" placeholder="HTML 코드"></textarea></label>

  <fieldset>
    <legend>미디어</legend>
    <label class="field"><span>정보 (미디어 이미지 제목)</span> <input type="text" id="media-info" placeholder="쇼피파이에 등록된 이미지 제목으로 검색" /></label>
    <label class="field"><span>순서</span> <input type="number" id="media-order" min="1" placeholder="예: 2" /></label>
    <div class="hint">기타</div>
    <label><input type="radio" name="media-mode" value="insert" /> 삽입 (해당 순서에 끼워넣고 이후 순서 밀림)</label>
    <label><input type="radio" name="media-mode" value="overwrite" /> 덮어쓰기 (해당 순서 이미지만 교체)</label>
  </fieldset>
</section>

<section class="card">
  <button id="btn-apply" class="btn-primary" disabled>검색된 페이지에 수정사항 적용</button>
</section>

<section class="card">
  <h2>적용 결과</h2>
  <div id="apply-results"></div>
</section>

<script src="app.js"></script>
</body>
</html>
